server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate /etc/ssl/certs/paracosm-vtt.pem;
    ssl_certificate_key /etc/ssl/private/paracosm-vtt.key;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket
    location = /api/control/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # FastAPI — all API routes and static assets
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/assets/ {
        alias /assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Svelte SPA — everything else falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
