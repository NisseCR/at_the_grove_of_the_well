services:
  ws-relay:
    build: ./ws-relay
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: ./app
      args:
        PUBLIC_ASSETS_BASE: ${PUBLIC_ASSETS_BASE}
        PUBLIC_DISCORD_CLIENT_ID: ${PUBLIC_DISCORD_CLIENT_ID}
    env_file: .env
    depends_on:
      - ws-relay
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_started
      ws-relay:
        condition: service_healthy
    restart: unless-stopped
