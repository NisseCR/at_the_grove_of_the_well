services:
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PROJECT_NAME: ${VITE_PROJECT_NAME}
        VITE_ASSETS_BASE: ${VITE_ASSETS_BASE}
    depends_on:
      - backend
    restart: unless-stopped
