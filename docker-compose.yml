services:
  ws-relay:
    build: ./ws-relay
    env_file: .env
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        PUBLIC_ASSETS_BASE: ${PUBLIC_ASSETS_BASE}
    env_file: .env
    depends_on:
      - ws-relay
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - app
      - ws-relay
    restart: unless-stopped
