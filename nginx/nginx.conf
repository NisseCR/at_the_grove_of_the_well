resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name story.paracosm-vtt.com;

    ssl_certificate /etc/ssl/certs/paracosm-vtt.pem;
    ssl_certificate_key /etc/ssl/private/paracosm-vtt.key;

    location / {
        rewrite ^(.*)$ /reader$1 break;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;

    ssl_certificate /etc/ssl/certs/paracosm-vtt.pem;
    ssl_certificate_key /etc/ssl/private/paracosm-vtt.key;

    location = /api/control/ws {
        set $upstream_ws ws-relay:8000;
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
